services:
  postgres:
    image: postgres:16-alpine
    container_name: vehicle_rental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vehicle_rental_db}
    ports:
      # Map to host port 5433 by default to avoid conflict with any host-installed PostgreSQL on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-vehicle_rental_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: vehicle_rental_app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:-your-super-secure-jwt-secret-key}
      CONNECTION_STRING: ${CONNECTION_STRING:-postgresql://postgres:postgres@postgres:5432/vehicle_rental_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
